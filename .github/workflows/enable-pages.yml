name: Enable GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages from main root
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          echo "POST /pages source branch=main path=/"
          POST_OUT=$(gh api -X POST "repos/${{ github.repository }}/pages" -f "source[branch]=main" -f "source[path]=/" 2>&1)
          POST_CODE=$?
          echo "$POST_OUT"
          if [ "$POST_CODE" -eq 0 ]; then
            exit 0
          fi
          echo "POST failed (exit $POST_CODE); trying PUT"
          gh api -X PUT "repos/${{ github.repository }}/pages" -f "source[branch]=main" -f "source[path]=/"
